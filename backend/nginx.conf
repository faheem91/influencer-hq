# Nginx configuration for agent.influencerhq.io
# Copy to: /etc/nginx/sites-available/agent.influencerhq.io
# Then: sudo ln -s /etc/nginx/sites-available/agent.influencerhq.io /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name agent.influencerhq.io;

    # Redirect HTTP to HTTPS (after SSL is set up)
    # Uncomment the following line after running certbot
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;

        # WebSocket/SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE-specific settings - CRITICAL for real-time logs
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Long timeout for SSE connections
        proxy_read_timeout 24h;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        # Disable response buffering
        proxy_buffer_size 0;
        proxy_buffers 0 0;
    }

    # API endpoint optimization
    location /api/ {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streams
        proxy_buffering off;
        proxy_cache off;

        # CORS headers (if needed, adjust origins)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}

